<!DOCTYPE html>
<html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="stylesheet" type="text/css" href="../css/contact.css">
</head>


<body>
    <header>
        <nav>
            <div class="boxmodel-nav">
                <ul>
                    <li><a href="../index.html">Home</a></li>
                    <li><a href="educations.html">Education</a></li>

                    <li><a href="projects.html">Projects</a></li>
                    <li>Contact</li>
                </ul>
            </div>
        </nav>
    </header>
    <form method="post">

        <fieldset>
            <legend>Contact Me Form</legend>
            <h2>Contact Me</h2>
            <table>

                <tr>
                    <td><label for="fname">First Name:</label></td>
                    <td> <input type="text" id="fname" placeholder="Enter your first name" name="fname" required></td>
                </tr>
                <tr>
                    <td><label for="lname">Last Name:</label></td>
                    <td><input type="text" id="lname" placeholder="Enter your last name" name="lname" required> </td>
                </tr>

                <tr>
                    <td><label>Gender:</label></td>
                    <td>
                        <input type="radio" name="gender" value="male" required> Male
                        <input type="radio" name="gender" value="female"> Female
                    </td>
                </tr>

                <tr>
                    <td><label for="email">Email:</label></td>
                    <td><input type="email" id="email" name="email" required></td>
                </tr>
                <tr>
                    <td><label for="name">Company:</label></td>
                    <td><input type="text" id="name" placeholder="Enter your company name" name="name"></td>
                </tr>

                <tr>
                    <td><label>Reason of contact:</label></td>
                    <td>
                        <input type="checkbox" value="Projects" required> Projects
                        <input type="checkbox" value="Thesis"> Thesis
                        <input type="checkbox" value="Job"> Job
                    </td>
                </tr>
                <!--
                <tr>
                    <td><label for="topics">Topics:</label></td>
                    <td>
                        <select id="topics" name="topics">
                            <option>Web Development</option>
                            <option>Mobile Development</option>
                            <option>AI/ML Development</option>
                            <option>Research</option>
                        </select>
                    </td>
                </tr>
            -->

                <tr>
                    <td><label>Reason of contact:</label></td>
                    <td>
                        <input type="checkbox" value="Web Development" required> Web Development
                        <input type="checkbox" value="Mobile Development"> Mobile Development
                        <input type="checkbox" value="AI/ML Development"> AI/ML Development
                        <input type="checkbox" value="Research"> Research
                    </td>
                </tr>

                <tr>
                    <td><label for="date">Consultation Date:</label></td>
                    <td><input type="date" id="date" name="date" required></td>
                </tr>
                <tr>
                    <td><label for="time">Consultation Time:</label></td>
                    <td><input type="time" id="time" name="time" required></td>

                </tr>

                <tr>
                    <td></td>
                    <td>
                        <br>
                        <input type="submit" value="Register">
                        <input type="reset">
                    </td>
                </tr>

            </table>

        </fieldset>

    </form>

</body>
